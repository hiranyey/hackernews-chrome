name: Build and Push to RepoFlow

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to RepoFlow Registry
        uses: docker/login-action@v3
        with:
          registry: api.repoflow.io
          username: ${{ secrets.REPOFLOW_USERNAME }}
          password: ${{ secrets.REPOFLOW_PASSWORD }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: api.repoflow.io/hiranyeyg-6713/hackernews-chrome/server:${{ github.sha::7 }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
