name: Deploy Worker

on:
  push:
    branches: ["main"]
    paths:
      - "worker/**"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Cloudflare API token
        id: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_API_TOKEN is not set; skipping Worker deploy."
          fi
          if [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "account=true" >> "$GITHUB_OUTPUT"
          else
            echo "account=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy
        if: steps.cf.outputs.present == 'true' && steps.cf.outputs.account != 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker
          packageManager: npm

      - name: Deploy with account id
        if: steps.cf.outputs.present == 'true' && steps.cf.outputs.account == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          packageManager: npm
