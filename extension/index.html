<!DOCTYPE html>
<html lang="en" data-theme="catppuccin">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>New Tab</title>
  <script>document.documentElement.dataset.theme = localStorage.getItem('hn-theme') || 'dracula';</script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="controls">
    <button id="saved-btn" aria-label="Saved stories">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
      </svg>
      <span id="saved-count"></span>
    </button>
    <div id="theme-picker-wrap">
      <button id="theme-btn" aria-label="Change theme">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
          <circle cx="4" cy="4" r="2.5"/>
          <circle cx="12" cy="4" r="2.5"/>
          <circle cx="4" cy="12" r="2.5"/>
          <circle cx="12" cy="12" r="2.5"/>
        </svg>
      </button>
      <div id="theme-panel"></div>
    </div>
  </div>
  <main id="stories"></main>
  <script src="theme-switcher.js"></script>
  <script src="script.js"></script>
</body>
</html>
